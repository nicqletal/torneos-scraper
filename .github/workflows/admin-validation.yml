name: Validar panel de administración
on:
  push:
    branches: [codex/admin-completo]
  pull_request:
    paths: ['src/**', 'supabase/**', '.github/workflows/admin-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Iniciar Supabase local y aplicar migraciones
        run: supabase start
      - name: Verificar permisos y reglas con pgTAP
        run: supabase test db
      - name: Detener entorno local
        if: always()
        run: supabase stop --no-backup
